plugins {
    id "com.android.application"
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.alpine.shared.alpine.AlpineBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("ALPINE_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
}

android {
    namespace = "com.alpine"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("ALPINE_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("ALPINE_APK_VERSION_TAG") ?: ""

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.drawerlayout:drawerlayout:1.2.0"
        implementation "androidx.preference:preference:1.2.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.android.material:material:1.12.0"
        implementation "com.google.guava:guava:33.3.1-android"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

        implementation project(":terminal-view")
        implementation project(":alpine-shared")
        implementation project(":x11")
    }

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 149
        versionName "0.137.0-v70-dev"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)
        ndk { abiFilters "arm64-v8a" }

        buildConfigField "String", "ALPINE_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by AlpineApplication class

        manifestPlaceholders.ALPINE_PACKAGE_NAME = "com.alpine"
        manifestPlaceholders.ALPINE_APP_NAME = "Alpine"
        manifestPlaceholders.ALPINE_API_APP_NAME = "Alpine:API"
        manifestPlaceholders.ALPINE_BOOT_APP_NAME = "Alpine:Boot"
        manifestPlaceholders.ALPINE_FLOAT_APP_NAME = "Alpine:Float"
        manifestPlaceholders.ALPINE_STYLING_APP_NAME = "Alpine:Styling"
        manifestPlaceholders.ALPINE_TASKER_APP_NAME = "Alpine:Tasker"
        manifestPlaceholders.ALPINE_WIDGET_APP_NAME = "Alpine:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-Wl,--gc-sections"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug" || variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI) ?: "arm64-v8a"
                def versionTag = apkVersionTag ? apkVersionTag : variant.versionName
                outputFileName = new File("alpine-app_" + versionTag + "_" + abi + ".apk")
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.0.4"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

clean {
    doLast {
        // Keep the local embedded bootstrap. downloadBootstraps is disabled for
        // this fork, so deleting bootstrap-*.zip makes clean builds fail.
    }
}

def preparedBootstrap = file("src/main/cpp/bootstrap-aarch64.zip")
def bootstrapNativeStamp = file("${layout.buildDirectory.get().asFile}/generated/bootstrap/bootstrap-input.h")

task verifyBootstrap() {
    doLast {
        if (!preparedBootstrap.isFile() || preparedBootstrap.length() == 0) {
            throw new GradleException("Prepared arm64 bootstrap is missing. From the repository root run: python scripts/fetch-assets.py --bootstrap && python scripts/prepare-v68-bootstrap.py")
        }
        logger.lifecycle("Using prepared bootstrap: ${preparedBootstrap.name} (${preparedBootstrap.length()} bytes)")
    }
}

// alpine-bootstrap-zip.S uses .incbin, which clang's normal dependency file does
// not track. Generate a tiny header from the ZIP content and include it from the
// assembly source so both Gradle and ndk-build invalidate libalpine-bootstrap.so
// whenever the prepared bootstrap changes.
task prepareBootstrapNativeInput(dependsOn: verifyBootstrap) {
    inputs.file(preparedBootstrap)
    outputs.file(bootstrapNativeStamp)
    doLast {
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        preparedBootstrap.withInputStream { input ->
            byte[] buffer = new byte[1024 * 1024]
            int count
            while ((count = input.read(buffer)) > 0) {
                digest.update(buffer, 0, count)
            }
        }
        def sha256 = digest.digest().encodeHex().toString()
        def stampText = "#define ALPINE_BOOTSTRAP_SHA256 \"${sha256}\"\n"
        bootstrapNativeStamp.parentFile.mkdirs()
        if (!bootstrapNativeStamp.isFile() || bootstrapNativeStamp.getText("UTF-8") != stampText) {
            bootstrapNativeStamp.setText(stampText, "UTF-8")
        }
    }
}

tasks.configureEach { t ->
    if (t.name.startsWith("configureNdkBuild") || t.name.startsWith("buildNdkBuild")) {
        t.dependsOn prepareBootstrapNativeInput
        t.inputs.file(preparedBootstrap)
        t.inputs.file(bootstrapNativeStamp)
    }
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        variant.javaCompileProvider.get().dependsOn(verifyBootstrap)
    }
}
