buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // termux-am-library v2.0.0 is published through JitPack despite its com.termux coordinates.
        maven { url = uri("https://jitpack.io") }
    }
}
